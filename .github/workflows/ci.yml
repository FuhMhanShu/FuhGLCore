name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository (no write token).
permissions:
  contents: read

# Cancel superseded runs of the same workflow/ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to the v4.2.2 commit SHA (immutable) — a moving tag could be repointed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: qmake smoke build (Linux only) — fuhglcore.pro standalone lib + fuhglcore.pri as consumer dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev
          # package name differs across Ubuntu releases: qmake6 (newer) or qt6-qmake (older)
          sudo apt-get install -y qmake6 || sudo apt-get install -y qt6-qmake
          qmake6 --version
          mkdir -p build-qmake && cd build-qmake
          qmake6 ../fuhglcore.pro
          make -j"$(nproc)"
          # guard: the archive must contain all FuhGLCore objects (guards against
          # silently empty $$files() globs in fuhglcore.pri)
          test "$(ar t libfuhglcore.a | wc -l)" -ge 30
          mkdir -p consumer && cd consumer
          cat > consumer.pro <<'PRO_EOF'
          TEMPLATE = app
          CONFIG += console c++17
          CONFIG -= app_bundle qt gui
          TARGET = consumer
          include($$FUHGLCORE_DIR/fuhglcore.pri)
          SOURCES += main.cpp
          PRO_EOF
          cat > main.cpp <<'CPP_EOF'
          #include <fuhgl/render.hpp>
          #include <fuhgl/math/vec.hpp>
          int main() {
              fuhgl::math::Vec3 v(1.f, 2.f, 3.f);
              return (v.x == 1.f && v.y == 2.f && v.z == 3.f) ? 0 : 1;
          }
          CPP_EOF
          qmake6 "FUHGLCORE_DIR=$GITHUB_WORKSPACE" consumer.pro
          make -j"$(nproc)"
          ./consumer

      - name: Unit tests (label "unit" — no GL context required)
        run: ctest --test-dir build -C Release --output-on-failure -L unit

      - name: GL-context smoke tests (label "gl_context" — reported as Skipped without a context, must pass where one exists)
        run: ctest --test-dir build -C Release --output-on-failure -L gl_context

      - name: EGL backend build + headless GL smoke tests (Linux only, real GL via llvmpipe — no skips allowed here)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri
          cmake -S . -B build-egl -DFUHGL_LINUX_BACKEND=EGL -DCMAKE_BUILD_TYPE=Release
          cmake --build build-egl --config Release -j
          cd build-egl && FUHGL_DEBUG=1 FUHGL_BACKEND=surfaceless ctest -C Release -L "unit|gl_context" --output-on-failure
          FUHGL_DEBUG=1 FUHGL_BACKEND=surfaceless ctest -C Release -L gl_context -V 2>&1 | grep -E "gl_smoke:|SKIP|debug" || true

      - name: Smoke-run example under Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglu1-mesa
          rc=0
          timeout 10 xvfb-run -a ./build/examples/triangle || rc=$?
          # 124 = ran until timeout (window stayed open — good), 0 = clean exit; anything else fails the job
          if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit 1; fi

  hardening:
    # Strict-warnings build plus sanitizer run: keeps the CPU-side code free of
    # new warnings and catches memory errors / UB in the unit tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Strict build (-Werror, hardening flags ON by default)
        run: |
          cmake -S . -B build-strict -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Werror"
          cmake --build build-strict -j

      - name: Sanitizer build (ASan + UBSan, no recover)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DFUHGL_BUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build build-asan -j

      - name: Unit tests under ASan/UBSan (label "unit" — no GL context required)
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-asan --output-on-failure -L unit

  docs:
    # Doxygen HTML + tutorial screenshots as CI artifacts.
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.2.2 commit SHA (immutable) — a moving tag could be repointed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install tooling (doxygen, mesa for headless GL)
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Build with EGL backend (for headless rendering)
        run: |
          cmake -S . -B build-egl -DFUHGL_LINUX_BACKEND=EGL -DCMAKE_BUILD_TYPE=Release
          cmake --build build-egl --config Release -j

      - name: Generate Doxygen documentation
        run: cd docs && doxygen Doxyfile

      - name: Render tutorial screenshots (surfaceless EGL, no display needed)
        run: |
          mkdir -p docs/images
          FUHGL_BACKEND=surfaceless ./build-egl/examples/screenshot --out docs/images/tutorial-first-triangle.png --camera fp --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/screenshot --out docs/images/tutorial-isometric-skybox.png --camera iso --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/deferred --screenshot docs/images/tutorial-deferred.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/deferred --screenshot docs/images/tutorial-forward.png --forward --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/gpuinfo --screenshot docs/images/tutorial-gpuinfo.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/stream --screenshot docs/images/tutorial-stream.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-solids.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-csg-union.png --csg union --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-csg-difference.png --csg difference --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-csg-intersection.png --csg intersection --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-csg-bounds.png --csg bounds --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/lights --screenshot docs/images/tutorial-lights.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/shadows --screenshot docs/images/tutorial-shadows.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/forward --screenshot docs/images/tutorial-forward-renderer.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/forward --screenshot docs/images/tutorial-forward-renderer-noshadow.png --no-shadows --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/forward --screenshot docs/images/tutorial-forward-fx.png --fx --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/postfx --screenshot docs/images/tutorial-deferred-fx.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/postfx --screenshot docs/images/tutorial-deferred-fx-nofx.png --no-fx --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/text --screenshot docs/images/tutorial-text.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-wireframe.png --wireframe --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/showcase --screenshot docs/images/readme-showcase-day.png --mode day --width 960 --height 540
          FUHGL_BACKEND=surfaceless ./build-egl/examples/showcase --screenshot docs/images/readme-showcase-sunset.png --mode sunset --width 960 --height 540
          FUHGL_BACKEND=surfaceless ./build-egl/examples/showcase --screenshot docs/images/readme-showcase-night.png --mode night --width 960 --height 540
          FUHGL_BACKEND=surfaceless ./build-egl/examples/demo --screenshot docs/images/tutorial-renderer-demo-deferred.png --renderer deferred --mode day --width 960 --height 540
          FUHGL_BACKEND=surfaceless ./build-egl/examples/demo --screenshot docs/images/tutorial-renderer-demo-forward.png --renderer forward --mode day --width 960 --height 540
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-solids-textured.png --textured --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/instancing --screenshot docs/images/tutorial-instancing.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-noise.png --scene noise --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-pbr.png --scene pbr --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-ibl.png --scene ibl --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-csm.png --scene csm --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-taa.png --scene taa --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-ssr.png --scene ssr --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-culling.png --scene culling --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-bindless.png --scene bindless --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-dof.png --scene dof --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-volfog.png --scene volfog --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-heightmap.png --scene heightmap --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/features --screenshot docs/images/tutorial-lod.png --scene lod --width 800 --height 600

      - name: Upload Doxygen HTML artifact
        # Pinned to the v4.6.2 commit SHA (immutable) — a moving tag could be repointed.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doxygen-html
          path: docs/doxygen/html
          retention-days: 30

      - name: Upload screenshots artifact
        # Pinned to the v4.6.2 commit SHA (immutable) — a moving tag could be repointed.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tutorial-screenshots
          path: docs/images
          retention-days: 30
