name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test (headless unit tests; no GL context required)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: EGL backend build + headless GL smoke test (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri
          cmake -S . -B build-egl -DFUHGL_LINUX_BACKEND=EGL -DCMAKE_BUILD_TYPE=Release
          cmake --build build-egl --config Release -j
          cd build-egl && FUHGL_DEBUG=1 FUHGL_BACKEND=surfaceless ctest -C Release -R "gl_smoke|fuhgl_tests" --output-on-failure
          FUHGL_DEBUG=1 FUHGL_BACKEND=surfaceless ctest -C Release -R "gl_smoke" -V 2>&1 | grep -E "gl_smoke:|debug" || true

      - name: Smoke-run example under Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglu1-mesa
          rc=0
          timeout 10 xvfb-run -a ./build/examples/triangle || rc=$?
          # 124 = ran until timeout (window stayed open, good), 0 = clean exit, 1 = clean headless-failure message
          if [ $rc -ne 0 ] && [ $rc -ne 124 ] && [ $rc -ne 1 ]; then exit 1; fi

  docs:
    # Doxygen HTML + tutorial screenshots as CI artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling (doxygen, mesa for headless GL)
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Build with EGL backend (for headless rendering)
        run: |
          cmake -S . -B build-egl -DFUHGL_LINUX_BACKEND=EGL -DCMAKE_BUILD_TYPE=Release
          cmake --build build-egl --config Release -j

      - name: Generate Doxygen documentation
        run: cd docs && doxygen Doxyfile

      - name: Render tutorial screenshots (surfaceless EGL, no display needed)
        run: |
          mkdir -p docs/images
          FUHGL_BACKEND=surfaceless ./build-egl/examples/screenshot --out docs/images/tutorial-first-triangle.png --camera fp --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/screenshot --out docs/images/tutorial-isometric-skybox.png --camera iso --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/deferred --screenshot docs/images/tutorial-deferred.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/deferred --screenshot docs/images/tutorial-forward.png --forward --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/gpuinfo --screenshot docs/images/tutorial-gpuinfo.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/stream --screenshot docs/images/tutorial-stream.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-solids.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-csg-union.png --csg union --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-csg-difference.png --csg difference --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-csg-intersection.png --csg intersection --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-csg-bounds.png --csg bounds --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/lights --screenshot docs/images/tutorial-lights.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/shadows --screenshot docs/images/tutorial-shadows.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/forward --screenshot docs/images/tutorial-forward-renderer.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/forward --screenshot docs/images/tutorial-forward-renderer-noshadow.png --no-shadows --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/postfx --screenshot docs/images/tutorial-deferred-fx.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/postfx --screenshot docs/images/tutorial-deferred-fx-nofx.png --no-fx --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/text --screenshot docs/images/tutorial-text.png --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-wireframe.png --wireframe --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/solids --screenshot docs/images/tutorial-solids-textured.png --textured --width 800 --height 600
          FUHGL_BACKEND=surfaceless ./build-egl/examples/instancing --screenshot docs/images/tutorial-instancing.png --width 800 --height 600

      - name: Upload Doxygen HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/doxygen/html
          retention-days: 30

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-screenshots
          path: docs/images
          retention-days: 30
